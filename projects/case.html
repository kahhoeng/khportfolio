<!doctype html>
<html lang="zh-Hant" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品｜K.H Design</title>
  <meta name="description" content="K.H Design 黃家禾的作品內頁。">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    /* 格線版作品內頁：整頁是一張用 1px 細線切開的表格（平板以上 4 欄，手機 1 欄）。
       左欄放章節說明（捲動時黏在畫面上），右側三欄放圖面，兩張一組照施工階段排列。 */
    @font-face { font-family: "GenWanMin"; src: url("../assets/fonts/GenWanMin2TW-R-latin.woff2") format("woff2"); font-weight: 400; font-display: swap; }

    :root {
      --bg: #ffffff;
      --page: #ececeb;
      --plate: #f3f3f2;
      --ink: #1d1e1f;
      --ink-2: #5f6163;
      --ink-3: #8c8e90;
      --rule: #e2e2e0;
      --sq: linear-gradient(135deg, #f2f2f2 0%, #b9bbbc 48%, #7f8285 100%);
      --f-brand: "GenWanMin", "Noto Serif TC", Georgia, serif;
      --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --pad: 18px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    button { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }

    .wrap { max-width: 1440px; margin: 0 auto; padding: 16px; }
    .page { container: page / inline-size; background: var(--bg); border: 1px solid var(--rule); }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr); }
    .cell { position: relative; min-width: 0; padding: var(--pad); border-bottom: 1px solid var(--rule); }
    .label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-3); }

    /* ---- 頁首（格線第一列） ---- */
    .head { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.96); backdrop-filter: blur(6px); }
    .head .cell { min-height: 60px; display: flex; align-items: flex-start; }
    .head .cell:nth-child(odd) { border-right: 1px solid var(--rule); }
    .head .cell:nth-child(n+3) { display: none; }
    .brand { display: grid; gap: 2px; }
    .brand img { height: 20px; width: auto; }
    .brand { gap: 6px; }
    .brand small { font-family: var(--f-mono); font-size: 9px; letter-spacing: 0.28em; color: var(--ink-2); }
    .head__right { justify-content: flex-end; gap: 18px; }

    /* ---- 標題列 ---- */
    .title-cell { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; min-height: 170px; }
    .title { font-size: clamp(32px, 6cqi, 64px); font-weight: 500; line-height: 1.1; letter-spacing: 0.02em; }
    .title-en { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
    .mark-cell { display: none; }
    .mark { position: absolute; left: var(--pad); bottom: var(--pad); width: 44px; height: 44px; border-radius: 8px; background: var(--sq); box-shadow: -6px 10px 16px rgba(20,22,24,0.25); }

    /* ---- 概要 ---- */
    .meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 0; }
    .meta dt { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
    .meta dd { margin: 0; }
    .story { display: grid; gap: 6px; }
    .story h3 { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--ink-3); }

    /* ---- 圖面 ---- */
    .plates { display: grid; gap: 1px; background: var(--rule); }
    .plate { margin: 0; background: var(--plate); display: flex; flex-direction: column; }
    .plate__btn { border: 0; padding: clamp(14px, 3.4cqi, 40px); background: none; cursor: zoom-in; display: grid; place-items: center; flex: 1; width: 100%; }
    .plate__btn img { max-height: min(62vh, 620px); width: auto; object-fit: contain; mix-blend-mode: multiply; }
    .plate__btn--render img { mix-blend-mode: normal; }
    .plate:has(.plate__btn--render) { background: #fff; }
    .plate figcaption { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--rule); background: var(--bg); font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
    .plate figcaption b { font-family: var(--f-body); font-weight: 500; color: var(--ink); }

    .chapter__side { display: grid; gap: 18px; align-content: start; }
    .chapter__no { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ink-3); }
    .chapter__title { font-size: 20px; font-weight: 700; letter-spacing: 0.04em; }
    .sheet { display: grid; gap: 4px; padding-top: 12px; border-top: 1px solid var(--rule); }
    .sheet__name { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
    .sheet__name span { font-family: var(--f-mono); font-size: 11px; font-weight: 400; color: var(--ink-2); }
    .sheet__text { color: var(--ink-2); font-size: 13px; }

    /* ---- 上下頁 ---- */
    .pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pager .cell { min-height: 76px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
    .pager .cell:first-child { border-right: 1px solid var(--rule); }
    .pager .cell:last-child { align-items: flex-end; text-align: right; }
    .pager .cell--mid { display: none; }
    .pager b { font-weight: 500; }
    .foot { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); border-bottom: 0; }

    /* ======== 平板以上：4 欄格線 ======== */
    @container page (min-width: 760px) {
      :root { --pad: 20px; }
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .row { display: contents; }
      .cell { border-right: 1px solid var(--rule); }
      .row > .cell:last-child, .head > .cell:last-child, .pager > .cell:last-child { border-right: 0; }
      .span-3 { grid-column: span 3; }
      .span-4 { grid-column: span 4; }

      .head { display: contents; }
      .head .cell { min-height: 92px; position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.96); }
      .head .cell:nth-child(n+3) { display: flex; }
      .head .cell:nth-child(odd) { border-right: 1px solid var(--rule); }

      .mark-cell { display: block; }
      .title-cell { min-height: 220px; }

      .meta { grid-template-columns: minmax(0, 1fr); }
      .story-row .cell { min-height: 150px; }

      .chapter__side > .sticky { position: sticky; top: 112px; display: grid; gap: 18px; }
      .plates--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .plates--stack { grid-template-columns: minmax(0, 1fr); }

      .pager { display: contents; }
      .pager .cell { min-height: 110px; }
      .pager .cell--mid { display: flex; }
      .pager .cell:first-child { border-right: 1px solid var(--rule); }
    }


    /* ---- 通用內頁：3 欄相簿、照片滿版 ---- */
    .intro { color: var(--ink-2); max-width: 46em; }
    .plates--one { grid-template-columns: minmax(0, 1fr); }
    .plate--photo .plate__btn { padding: 0; }
    .plate--photo .plate__btn img { width: 100%; max-height: none; mix-blend-mode: normal; }
    .plate:not(.plate--photo) .plate__btn img { mix-blend-mode: normal; box-shadow: 0 1px 0 var(--rule), 0 10px 30px rgba(20,22,24,0.08); }
    .loading { padding: 40px var(--pad); color: var(--ink-2); }
    @container page (min-width: 760px) {
      .plates--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .plates--3 .plate__btn img { max-height: min(48vh, 460px); }
    }


    /* ---- 概要三欄、連結、影片 ---- */
    .story p, .role { font-size: 13.5px; color: var(--ink-2); }
    .role { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
    .links { display: grid; gap: 2px; }
    .links a, .side-link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); word-break: break-word; }
    .side-link { font-family: var(--f-mono); font-size: 12px; }
    .plate.plate--drawing .plate__btn img { box-shadow: none; mix-blend-mode: multiply; }
    .plate--video { background: #111; }
    .video, .video__frame { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; padding: 0; position: relative; background: #111; cursor: pointer; }
    .video img { width: 100%; height: 100%; object-fit: cover; opacity: 0.86; transition: opacity 0.3s; }
    .video:hover img { opacity: 1; }
    .video__blank { position: absolute; inset: 0; display: grid; place-items: end start; padding: 14px; background: linear-gradient(135deg, #3a3c3e, #1b1c1d); color: #fff; font-family: var(--f-mono); font-size: 12px; }
    .video__play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 16px; background: var(--sq); box-shadow: -6px 10px 18px rgba(0,0,0,0.35); }
    .video__play::after { content: ""; position: absolute; left: 26px; top: 20px; border-left: 18px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
    .plate--video figcaption a { color: var(--ink-2); }

    /* 放大檢視 */
    .lb { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #fbfbfa; }
    .lb::backdrop { background: rgba(0,0,0,0.4); }
    .lb__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--rule); background: #fff; font-family: var(--f-mono); font-size: 12px; }
    .lb__btn { min-width: 44px; min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; background: #fff; cursor: pointer; }
    .lb__stage { height: calc(100dvh - 62px); overflow: auto; display: grid; place-items: center; padding: 20px; }
    .lb__stage img { max-width: 100%; max-height: 100%; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
<script src="../assets/js/track.js?v=20261029a"></script>
<!-- 通用作品內頁：網址 case.html?id=作品id，內容讀 assets/data/works.json 與 cases.json -->
<div class="wrap">
  <article class="page" aria-labelledby="p-title">
    <div class="grid" id="grid">
      <nav class="head" aria-label="網站">
        <div class="cell"><a class="brand" href="../index.html" aria-label="K.H Design 首頁"><img class="brand__logo" src="../assets/img/logo/kh-design-wordmark.svg" alt="" width="116" height="22"><small>SPACE · OBJECT · MEDIA</small></a></div>
        <div class="cell head__right"><a href="../index.html#work">Work</a><a href="../index.html#contact">Contact</a></div>
        <div class="cell"><a href="../index.html#work">← Work Index</a></div>
        <div class="cell head__right"><span class="label" id="p-index"></span></div>
      </nav>
      <div class="cell span-4 loading" id="loading">載入中…</div>
    </div>
  </article>
</div>

<dialog class="lb" id="lb" aria-label="圖片放大">
  <div class="lb__bar"><span id="lb-cap"></span><button class="lb__btn" type="button" id="lb-close" aria-label="關閉">✕</button></div>
  <div class="lb__stage"><img id="lb-img" alt=""></div>
</dialog>

<script>
(async () => {
  const h = (tag, attrs = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v); }
    for (const c of [].concat(kids)) if (c) n.append(c);
    return n;
  };
  const pad = (n) => String(n).padStart(2, '0');
  // 圖檔：名稱不含 / 的放在 assets/img/case/（.jpg）；含 / 的照路徑讀，例如 work/bed_layout.png
  const src = (file) => (file.includes('/') ? `../assets/img/${file}` : `../assets/img/case/${file}.jpg`);
  const grid = document.getElementById('grid');
  const id = new URLSearchParams(location.search).get('id');
  let works, cases;
  try {
    [works, cases] = await Promise.all(['../assets/data/works.json', '../assets/data/cases.json'].map((u) => fetch(u, { cache: 'no-cache' }).then((r) => r.json())));
  } catch (e) { document.getElementById('loading').textContent = '資料載入失敗，請重新整理頁面。'; return; }
  const w = works.works.find((x) => x.id === id);
  const c = cases.cases[id];
  if (!w || !c) { document.getElementById('loading').innerHTML = '找不到這件作品。<a href="../index.html#work">回到 Work Index</a>'; return; }
  document.getElementById('loading').remove();

  const cat = works.categories.find((x) => x.id === w.cat) || {};
  // 從 landing page 進來時，上下頁只在同一個領域裡循環
  const T = window.KHTrack || {};
  const tl = T.list ? T.list(works) : null;
  const same = tl && tl.includes(w) ? tl : works.works.filter((x) => x.cat === w.cat);
  const tlabel = tl && tl.includes(w) ? (T.id === 'interior' ? 'INTERIOR DESIGN' : 'MARKETING DESIGN') : String(cat.en || '').toUpperCase();
  document.title = `${w.title.zh}｜K.H Design`;
  document.getElementById('p-index').textContent = `${pad(same.indexOf(w) + 1)} / ${pad(same.length)} · ${tlabel}`;

  const total = c.chapters.reduce((n, ch) => n + (ch.images || []).length, 0);
  const vids = c.chapters.reduce((n, ch) => n + (ch.videos || []).length, 0);
  const append = (...nodes) => nodes.forEach((n) => grid.append(n));

  // 標題列
  append(h('div', { class: 'row' }, [
    h('div', { class: 'cell mark-cell' }, h('span', { class: 'mark', 'aria-hidden': 'true' })),
    h('div', { class: 'cell span-3 title-cell' }, [
      h('span', { class: 'label', text: [c.badge, w.year].filter(Boolean).join(' · ') }),
      h('h1', { class: 'title', id: 'p-title', text: w.title.zh }),
      h('span', { class: 'title-en', text: c.en || w.title.en }),
    ]),
  ]));
  // 概要：左欄專案資料＋連結；右側三欄 專案概述／關鍵挑戰／我負責的部分
  append(h('div', { class: 'row' }, [
    h('div', { class: 'cell' }, h('dl', { class: 'meta' }, [
      ...c.meta.map(([k, v]) => h('div', {}, [h('dt', { text: k }), h('dd', { text: v })])),
      w.year ? h('div', {}, [h('dt', { text: '年份' }), h('dd', { text: w.year })]) : null,
      h('div', {}, [h('dt', { text: '圖片／影片' }), h('dd', { text: vids ? `${total} 張 · ${vids} 支影片` : `${total} 張` })]),
      c.links ? h('div', {}, [h('dt', { text: '連結' }), h('dd', { class: 'links' }, c.links.map(([t, u]) => h('a', { href: u, target: '_blank', rel: 'noopener', text: t + ' ↗' })))]) : null,
    ])),
    // story：自訂三欄（例如課程作品的 練習目標／做法／成果）；沒有就用 概述／挑戰／負責項目
    ...(c.story ? c.story.map(([t, x]) => h('div', { class: 'cell story' }, [h('h3', { text: t }), h('p', { text: x })])) : [
      h('div', { class: 'cell story' }, [h('h3', { text: '專案概述' }), h('p', { text: c.overview || w.summary.zh })]),
      h('div', { class: 'cell story' }, c.challenge ? [h('h3', { text: '關鍵挑戰' }), h('p', { text: c.challenge })] : []),
      h('div', { class: 'cell story' }, c.role ? [h('h3', { text: '我負責的部分' }), h('ul', { class: 'role' }, c.role.map((r) => h('li', { text: r })))] : []),
    ]),
  ]));
  // 章節
  let n = 0;
  c.chapters.forEach((ch, i) => {
    const side = h('div', { class: 'cell chapter__side' }, h('div', { class: 'sticky' }, [
      h('span', { class: 'chapter__no', text: `CHAPTER ${pad(i + 1)} / ${pad(c.chapters.length)}` }),
      h('h2', { class: 'chapter__title', text: ch.title }),
      h('p', { class: 'sheet__text', text: ch.text }),
      ch.playlist ? h('a', { class: 'side-link', href: `https://www.youtube.com/playlist?list=${ch.playlist}`, target: '_blank', rel: 'noopener', text: '看完整播放清單 ↗' }) : null,
    ]));
    const cls = `plates plates--${ch.layout === 'one' ? 'one' : ch.layout === '3' ? '3' : '2'}`;
    // YouTube：先顯示封面，點了才載入播放器（不拖慢頁面）
    const videoPlates = (ch.videos || []).map(([yt, cap, poster]) => h('figure', { class: 'plate plate--video' }, [
      h('button', { class: 'video', type: 'button', 'data-yt': yt, 'aria-label': `播放影片：${cap}` }, [
        poster ? h('img', { src: src(poster), alt: '', loading: 'lazy', decoding: 'async' }) : h('span', { class: 'video__blank', 'aria-hidden': 'true' }, [h('b', { text: cap })]),
        h('span', { class: 'video__play', 'aria-hidden': 'true' }),
      ]),
      h('figcaption', {}, [h('b', { text: cap }), h('a', { href: `https://www.youtube.com/watch?v=${yt}${ch.playlist ? '&list=' + ch.playlist : ''}`, target: '_blank', rel: 'noopener', text: 'YouTube ↗' })]),
    ]));
    const imagePlates = (ch.images || []).map(([file, cap]) => {
      n += 1;
      return h('figure', { class: 'plate' + (ch.photo ? ' plate--photo' : '') + (ch.drawing ? ' plate--drawing' : '') }, [
        h('button', { class: 'plate__btn', type: 'button', 'data-zoom': '', 'data-caption': cap },
          h('img', { src: src(file), alt: `${w.title.zh}：${cap}`, loading: 'lazy', decoding: 'async' })),
        h('figcaption', {}, [h('b', { text: cap }), h('span', { text: `${pad(n)} / ${pad(total)}` })]),
      ]);
    });
    const plates = h('div', { class: cls }, [...videoPlates, ...imagePlates]);
    append(h('div', { class: 'row' }, [side, h('div', { class: 'cell span-3', style: 'padding:0' }, plates)]));
  });
  // 上下頁：同類別內循環
  const k = same.indexOf(w);
  const prev = same[(k - 1 + same.length) % same.length], next = same[(k + 1) % same.length];
  const link = (x, dir, label) => {
    const href = T.withT ? T.withT(x.href ? '../' + x.href : '../works.html#cat=' + x.cat) : (x.href ? '../' + x.href : '../works.html#cat=' + x.cat);
    return h('a', { class: 'cell', href }, [h('span', { class: 'label', text: dir }), h('b', { text: label + x.title.zh })]);
  };
  append(h('div', { class: 'pager' }, [
    link(prev, '← PREV', `${pad(same.indexOf(prev) + 1)} `),
    h('a', { class: 'cell cell--mid', href: '../works.html#cat=' + w.cat }, [h('span', { class: 'label', text: 'INDEX' }), h('b', { text: '全部' + (cat.zh || '') })]),
    h('div', { class: 'cell cell--mid', 'aria-hidden': 'true' }),
    link(next, 'NEXT →', `${pad(same.indexOf(next) + 1)} `),
  ]));
  append(h('div', { class: 'cell span-4 foot' }, [h('span', { text: '© 2026 K.H Design · 黃家禾' }), h('span', { text: (cat.en || '').toUpperCase() })]));
  if (T.fixLinks) T.fixLinks(grid);

  // 點封面才換成 YouTube 播放器
  document.addEventListener('click', (e) => {
    const v = e.target.closest('[data-yt]'); if (!v) return;
    const f = document.createElement('iframe');
    f.src = `https://www.youtube-nocookie.com/embed/${v.dataset.yt}?autoplay=1&rel=0`;
    f.title = v.getAttribute('aria-label');
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    f.allowFullscreen = true;
    f.className = 'video__frame';
    v.replaceWith(f);
  });
  // 放大檢視
  const lb = document.getElementById('lb');
  document.addEventListener('click', (e) => {
    const z = e.target.closest('[data-zoom]'); if (!z) return;
    const img = z.querySelector('img');
    document.getElementById('lb-img').src = img.src;
    document.getElementById('lb-img').alt = img.alt;
    document.getElementById('lb-cap').textContent = z.dataset.caption;
    lb.showModal();
  });
  document.getElementById('lb-close').addEventListener('click', () => lb.close());
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
})();
</script>
</body>
</html>
