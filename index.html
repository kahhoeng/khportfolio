<!doctype html>
<html lang="zh-Hant" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黃家禾｜K.H Design 作品集</title>
  <meta name="description" content="黃家禾 Kahhoe Ng 的作品集：室內設計，以及影像與行銷設計。">
  <meta property="og:title" content="黃家禾｜K.H Design 作品集">
  <meta property="og:description" content="室內設計／行銷設計，兩個領域的作品集。">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#ffffff">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css?v=20261029a">
  <link rel="stylesheet" href="assets/css/main.css?v=20261029a">
  <style>
    @font-face { font-family: "GenWanMin"; src: url("assets/fonts/GenWanMin2TW-R-latin.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    body { background: var(--c-bg); }
    .gate { min-height: 100svh; display: grid; grid-template-rows: auto auto 1fr auto; }
    .gate__bar { display: flex; align-items: center; justify-content: space-between; padding: 18px clamp(16px, 4vw, 48px); border-top: 2px solid var(--c-accent); }
    .gate__bar a { font-family: var(--f-mono); font-size: var(--fs-sm); color: var(--c-ink); }
    .gate__intro { padding: clamp(28px, 6vw, 72px) clamp(16px, 4vw, 48px) clamp(24px, 4vw, 48px); }
    .gate__brand { font-family: "GenWanMin", "Source Serif 4", Georgia, serif; font-weight: 400; font-size: clamp(48px, 8vw, 112px); line-height: 0.95; color: var(--c-ink); }
    .gate__tag { margin-top: 14px; font-family: var(--f-mono); font-size: clamp(12px, 1.3vw, 16px); letter-spacing: 0.32em; color: var(--c-ink-2); }
    .gate__who { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--c-ink-2); }
    .gate__who strong { color: var(--c-ink); font-weight: 500; }
    .gate__ask { margin-top: 6px; color: var(--c-ink-2); }

    .gate__paths { display: grid; gap: 0; border-top: 1px solid var(--c-line); }
    @media (min-width: 768px) { .gate__paths { grid-template-columns: 1fr 1fr; } }
    .path { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 20px; min-height: clamp(360px, 52vh, 600px);
      padding: clamp(24px, 4vw, 48px); text-decoration: none; color: var(--c-ink); overflow: hidden; }
    .path--space { background-color: var(--c-bg-soft); }
    .path--media { background: var(--c-black); color: #fff; }
    @media (min-width: 768px) { .path--space { border-right: 1px solid var(--c-line); } }
    .path__kicker { font-family: var(--f-mono); font-size: var(--fs-xs); letter-spacing: 0.12em; color: var(--c-accent-ink); }
    .path--media .path__kicker { color: var(--c-accent); }
    .path__title { margin-top: 8px; font-size: clamp(30px, 4vw, 52px); font-weight: 700; line-height: 1.1; }
    .path__sub { margin-top: 8px; color: var(--c-ink-2); }
    .path--media .path__sub { color: #b9bbbd; }
    .path__media { position: relative; display: grid; place-items: center; min-height: 0; }
    .path__media img { max-width: 100%; max-height: clamp(180px, 30vh, 340px); object-fit: contain; transition: transform 0.6s var(--ease); }
    .path--space .path__media img { mix-blend-mode: multiply; filter: drop-shadow(-10px 16px 22px rgba(52, 44, 40, 0.18)); }
    .path--media .path__media img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; opacity: 0.9; }
    .path:hover .path__media img { transform: scale(1.03); }
    .path__sq { position: absolute; width: clamp(48px, 7vw, 96px); aspect-ratio: 1; box-shadow: -6px 10px 20px rgba(52, 44, 40, 0.14); pointer-events: none; }
    .path__sq--a { left: 4%; top: 2%; background: linear-gradient(135deg, #d6d8d9 0%, #b0b3b5 55%, #959899 100%); }
    .path__sq--b { right: 6%; bottom: 4%; width: clamp(36px, 5vw, 64px); background: linear-gradient(135deg, #f1f1f1 0%, #e2e3e3 60%, #d3d4d5 100%); }
    .path__play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; background: var(--c-accent); box-shadow: -6px 10px 18px rgba(0,0,0,0.35); }
    .path__play::after { content: ""; position: absolute; left: 26px; top: 20px; border-left: 18px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
    .path__go { display: inline-flex; align-items: center; gap: 10px; justify-self: start; min-height: 48px; padding: 0 22px; border: 1px solid currentColor; font-size: var(--fs-md); }
    .path__go span { transition: transform 0.3s var(--ease); }
    .path:hover .path__go { background: var(--c-ink); color: #fff; border-color: var(--c-ink); }
    .path--media:hover .path__go { background: #fff; color: var(--c-black); border-color: #fff; }
    .path:hover .path__go span { transform: translateX(4px); }
    .path:focus-visible { outline-offset: -4px; }

    .gate__foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding: 18px clamp(16px, 4vw, 48px);
      font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--c-ink-2); border-top: 1px solid var(--c-line); }
    .gate__foot a { color: var(--c-ink); }
    @media (prefers-reduced-motion: reduce) { .path__media img, .path__go span { transition: none; } }
  </style>
</head>
<body>
  <div class="gate">
    <header class="gate__bar">
      <img src="assets/img/logo/kh-design-wordmark.svg" alt="K.H Design" width="116" height="22">
    </header>

    <div class="gate__intro grid-bg">
      <h1 class="gate__brand">K.H Design</h1>
      <p class="gate__tag">SPACE · OBJECT · MEDIA</p>
      <p class="gate__who"><strong>黃家禾</strong><span>室內設計 · 行銷設計</span></p>
      <p class="gate__ask">請選擇想看的作品領域。</p>
    </div>

    <main class="gate__paths">
      <a class="path path--space" href="interior.html">
        <div>
          <p class="path__kicker">[ 01 · SPACE ]</p>
          <h2 class="path__title">室內設計</h2>
          <p class="path__sub">空間繪圖 · 施工圖 · 3D 呈現</p>
        </div>
        <div class="path__media" aria-hidden="true">
          <span class="path__sq path__sq--a"></span><span class="path__sq path__sq--b"></span>
          <img src="assets/img/work/studio_render.jpg" alt="" decoding="async">
        </div>
        <span class="path__go">看室內設計作品 <span aria-hidden="true">→</span></span>
      </a>

      <a class="path path--media" href="marketing.html">
        <div>
          <p class="path__kicker">[ 02 · MEDIA ]</p>
          <h2 class="path__title">行銷設計</h2>
          <p class="path__sub">動態影像 · 行銷視覺 · 網站介面</p>
        </div>
        <div class="path__media" aria-hidden="true">
          <img src="assets/img/case/ikea_cover.jpg" alt="" decoding="async">
          <span class="path__play"></span>
        </div>
        <span class="path__go">看影像與行銷作品 <span aria-hidden="true">→</span></span>
      </a>
    </main>

    <footer class="gate__foot">
      <span>© 2026 K.H Design · 黃家禾 Kahhoe Ng</span>
      <a href="mailto:kahhoe.ng@gmail.com">kahhoe.ng@gmail.com</a>
    </footer>
  </div>
</body>
</html>
